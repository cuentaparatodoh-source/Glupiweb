<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="desktop">

    <div class="window">
      <div class="title-bar">
        <span class="title-bar-text">Mi Web</span>
        <div class="title-bar-controls">
          <button>_</button>
          <button>□</button>
          <button>✕</button>
        </div>
      </div>

      <div class="window-body">
        <p>¡Hola! Este es mi sitio web con estilo Windows 98.</p>
        <p>Sustituye este texto por el tuyo.</p>

        <button class="btn">Botón de ejemplo</button>

        <div class="field">
          <label>Escribe algo:</label>
          <input type="text" placeholder="Texto...">
        </div>
      </div>
    </div>

    <div class="window">
      <div class="title-bar">
        <span class="title-bar-text">Sobre mí</span>
        <div class="title-bar-controls">
          <button>_</button>
          <button>□</button>
          <button>✕</button>
        </div>
      </div>

      <div class="window-body">
        <p>Aquí va tu descripción o contenido.</p>
      </div>
    </div>

  </div>

</body>
</html>
